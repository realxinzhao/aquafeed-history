name: Replicate and test R pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Rebuild coefficients and run historical demand checks
        run: Rscript run_all.R
      - name: Upload validation and outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquafeed-${{ matrix.os }}
          path: |
            validation/R_test_results.csv
            outputs/
            data/processed/
          if-no-files-found: warn
          retention-days: 14
